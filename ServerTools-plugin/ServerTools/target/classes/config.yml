# ServerTools Configuration
# Project Poseidon - Beta 1.7.3

# Server rules displayed by /rules
# Add, remove, or edit entries as needed.
rules:
  - "1. No griefing or destroying other players’ builds."
  - "2. No stealing items, chests, or builds that aren’t yours."
  - "3. No hacking, cheating, x-ray, or unfair mods."
  - "4. No duplication glitches or bug exploits. Report them instead."
  - "5. No lag machines or anything that intentionally lags the server."
  - "6. PvP is only allowed if both players agree.
  - "7. No spam, flooding chat, or excessive caps."
  - "8. Be respectful to all players and staff."
  - "9. No advertising other servers or communities."
  - "10. Follow staff instructions at all times."
  - "11. Do not abuse bugs or glitches in any way."
  - "12. Report exploits immediately and do not share them."

# Join message sent privately to new players
# Use & for colour codes, e.g. &a for green, &e for yellow.
join-message:
  enabled: true
  lines:
    - "&eWelcome to the server!"
    - "&aType &f/rules &ato read the server rules."
    - "&aType &f/help &ato see all available commands."
