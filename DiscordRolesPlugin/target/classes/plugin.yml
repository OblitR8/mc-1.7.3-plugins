name: DiscordRolesPlugin
main: com.discordroles.DiscordRolesPlugin
version: 1.0.0
description: Integrates Discord roles into Minecraft Beta 1.7.3 chat
author: DiscordRoles
api-version: "1.0"

commands:
  discordlink:
    description: Link your Minecraft account to Discord
    usage: /discordlink
  discordunlink:
    description: Unlink your Minecraft account from Discord
    usage: /discordunlink
  discordreload:
    description: Reload the Discord plugin configuration
    usage: /discordreload
    permission: discordroles.admin

permissions:
  discordroles.admin:
    description: Admin commands for DiscordRoles
    default: op
